
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پنل مدیریت TATOO</title>
  <style>
    body{font-family:Arial,sans-serif;background:#111;color:#fff;padding:20px;margin:0}
    main{max-width:800px;margin:30px auto}
    .card{background:#222;padding:20px;border-radius:14px;margin:12px 0}
    input,button,select{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border-radius:8px;border:1px solid #555;font-size:16px}
    button{background:#d5ad64;color:#111;font-weight:bold;cursor:pointer}
    .reject{background:#e66;color:#111}
    .approve{background:#8c9}
    #message{white-space:pre-wrap;overflow-wrap:anywhere;color:#ffd080}
    .muted{color:#bbb}
  </style>
</head>
<body>
<main>
  <h1>پنل مدیریت TATOO</h1>
  <section class="card" id="login">
    <h3>ورود مدیر</h3>
    <input id="email" type="email" placeholder="ایمیل مدیر" autocomplete="username">
    <input id="password" type="password" placeholder="رمز عبور" autocomplete="current-password">
    <button id="loginBtn" type="button">ورود به پنل</button>
  </section>
  <p id="message" role="status">ایمیل و رمز مدیر را وارد کنید.</p>
  <section id="dashboard" hidden>
    <button id="refreshBtn" type="button">بروزرسانی نوبت‌ها</button>
    <button id="logoutBtn" type="button">خروج</button>
    <div id="appointments"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const PROJECT_URL = 'https://psxypwlqbxpmgngophca.supabase.co';
  const PUBLIC_KEY = 'sb_publishable_AwR8LYDCYBerpkNb0rCFQQ_6uxhMHg0';
  const db = window.supabase.createClient(PROJECT_URL, PUBLIC_KEY);

  const el = id => document.getElementById(id);
  const message = text => { el('message').textContent = text; };
  const safe = value => String(value ?? '—').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);

  async function loadAppointments() {
    message('در حال دریافت نوبت‌ها...');
    el('appointments').innerHTML = '';
    const { data, error } = await db
      .from('appointments')
      .select('id,tracking_code,customer_name,customer_phone,service,appointment_date,appointment_time,note,status,created_at')
      .order('created_at', { ascending: false });

    if (error) {
      message('خطا در دریافت نوبت‌ها:\n' + error.message);
      return;
    }

    if (!data || data.length === 0) {
      el('appointments').innerHTML = '<div class="card">هنوز نوبتی ثبت نشده است.</div>';
      message('ورود موفق بود؛ نوبتی برای نمایش پیدا نشد.');
      return;
    }

    el('appointments').innerHTML = data.map(a => `
      <article class="card">
        <h3>نوبت ${safe(a.tracking_code)}</h3>
        <p>نام: ${safe(a.customer_name)}</p>
        <p>تلفن: ${safe(a.customer_phone)}</p>
        <p>خدمت: ${safe(a.service)}</p>
        <p>تاریخ: ${safe(a.appointment_date)} | ساعت: ${safe(a.appointment_time)}</p>
        <p>توضیحات: ${safe(a.note)}</p>
        <p>وضعیت: <strong>${safe(a.status)}</strong></p>
        <button class="approve" data-id="${safe(a.id)}" data-status="approved">تأیید نوبت</button>
        <button class="reject" data-id="${safe(a.id)}" data-status="rejected">رد نوبت</button>
      </article>
    `).join('');

    el('appointments').querySelectorAll('button[data-id]').forEach(button => {
      button.addEventListener('click', () => updateStatus(button.dataset.id, button.dataset.status));
    });
    message('نوبت‌ها بارگذاری شدند.');
  }

  async function updateStatus(id, status) {
    message('در حال تغییر وضعیت...');
    const { error } = await db.from('appointments')
      .update({ status })
      .eq('id', id);
    if (error) {
      message('خطا در تغییر وضعیت:\n' + error.message);
      return;
    }
    message('وضعیت تغییر کرد.');
    await loadAppointments();
  }

  el('loginBtn').addEventListener('click', async () => {
    const email = el('email').value.trim();
    const password = el('password').value;
    if (!email || !password) {
      message('لطفاً ایمیل و رمز عبور را وارد کنید.');
      return;
    }

    el('loginBtn').disabled = true;
    message('در حال بررسی ورود...');
    try {
      const { data, error } = await db.auth.signInWithPassword({ email, password });
      if (error) {
        message('ورود انجام نشد:\n' + error.message);
        return;
      }
      if (!data.user) {
        message('کاربر تأیید نشد. دوباره تلاش کنید.');
        return;
      }
      el('login').hidden = true;
      el('dashboard').hidden = false;
      await loadAppointments();
    } catch (e) {
      message('خطا: ' + (e.message || 'اتصال برقرار نشد.'));
    } finally {
      el('loginBtn').disabled = false;
    }
  });

  el('refreshBtn').addEventListener('click', loadAppointments);
  el('logoutBtn').addEventListener('click', async () => {
    await db.auth.signOut();
    el('dashboard').hidden = true;
    el('login').hidden = false;
    el('password').value = '';
    message('از پنل خارج شدید.');
  });

  if (!window.supabase) {
    message('کتابخانه اتصال بارگذاری نشد. اینترنت را بررسی و صفحه را دوباره باز کنید.');
  }
})();
</script>
</body>
</html>
