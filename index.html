
<section id="tracking-section" dir="rtl" style="max-width:500px;margin:30px auto;padding:20px;background:#222;color:white;border-radius:14px;font-family:Arial,sans-serif">
  <h2>پیگیری نوبت</h2>
  <p>کد پیگیری که پس از ثبت نوبت دریافت کردی وارد کن.</p>
  <form id="tracking-form">
    <input id="tracking-code" required autocomplete="off"
      placeholder="کد پیگیری"
      style="box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border-radius:8px">
    <button id="tracking-button" type="submit"
      style="width:100%;padding:12px;border:0;border-radius:8px;cursor:pointer">
      بررسی وضعیت
    </button>
  </form>
  <p id="tracking-message" role="status" aria-live="polite"></p>
  <div id="tracking-result" hidden>
    <p>کد پیگیری: <strong id="tr-code"></strong></p>
    <p>خدمت: <strong id="tr-service"></strong></p>
    <p>تاریخ: <strong id="tr-date"></strong></p>
    <p>ساعت: <strong id="tr-time"></strong></p>
    <p>وضعیت: <strong id="tr-status"></strong></p>
  </div>
</section>

<script>
(() => {
  const client = window.supabase.createClient(
    'https://psxypwlqbxpmgngophca.supabase.co',
    'sb_publishable_AwR8LYDCYBerpkNb0rCFQQ_6uxhMHg0'
  );

  const form = document.getElementById('tracking-form');
  const input = document.getElementById('tracking-code');
  const button = document.getElementById('tracking-button');
  const message = document.getElementById('tracking-message');
  const result = document.getElementById('tracking-result');

  const show = (id, value) => {
    document.getElementById(id).textContent = value ?? '—';
  };

  form.addEventListener('submit', async event => {
    event.preventDefault();
    result.hidden = true;
    button.disabled = true;
    message.textContent = 'در حال بررسی کد پیگیری...';

    try {
      const { data, error } = await client.rpc('track_appointment', {
        p_tracking_code: input.value.trim()
      });

      if (error) throw error;

      if (!data || data.length === 0) {
        message.textContent = 'کد پیگیری پیدا نشد. کد را بررسی کن.';
        return;
      }

      const a = data[0];
      show('tr-code', a.tracking_code);
      show('tr-service', a.service);
      show('tr-date', a.appointment_date);
      show('tr-time', a.appointment_time);

      const statuses = {
        pending: 'در انتظار تأیید',
        approved: 'تأیید شده',
        rejected: 'رد شده'
      };
      show('tr-status', statuses[a.status] || a.status);
      result.hidden = false;
      message.textContent = '';
    } catch (error) {
      message.textContent = 'خطا در پیگیری: ' + error.message;
    } finally {
      button.disabled = false;
    }
  });
})();
        </script>
